_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.upgrade-step.yml

_plonecli:
  type: sub
  parent: backend_addon
  description: "Add a GenericSetup upgrade step"
  commit_message: "Add upgrade step {destination_version}: {upgrade_step_title}"

# Shared across steps: render once, never conflict on later runs.
_skip_if_exists:
  - "src/**/upgrades/__init__.py"

_jinja_extensions:
  - copier_template_extensions.TemplateExtensionLoader
  - extensions.py:AddonContextHook

_tasks:
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "validate"
      - "{{ _copier_conf.dst_path }}"
    when: "{{ _copier_conf.operation == 'copy' }}"
  - command:
      - "uv"
      - "run"
      - "--no-project"
      - "--with"
      - "tomlkit"
      - "python3"
      - "{{ _copier_conf.src_path }}/copier_hooks.py"
      - "post_copy"
      - "{{ _copier_conf.dst_path }}"
      - "{{ upgrade_step_title }}"
      - "{{ source_version }}"
      - "{{ destination_version }}"
      - "{{ upgrade_step_import_steps | join(',') }}"

# Upgrade step title
upgrade_step_title:
  type: str
  help: "Upgrade step title (e.g., 'Add catalog index', 'Migrate content')"
  validator: "{% if not upgrade_step_title %}Upgrade step title is required{% endif %}"

upgrade_step_description:
  type: str
  help: "Short description of the upgrade step"
  default: "A custom upgrade step"

# Package info - read from parent addon via AddonContextHook
package_name:
  type: str
  help: "Parent addon package name"

package_folder:
  type: str
  help: "Parent addon package folder (e.g., collective/mypackage)"
  default: "{{ package_name | replace('.', '/') }}"

# Profile versions - current_profile_version injected by AddonContextHook
source_version:
  type: str
  help: "Source profile version (current version)"
  default: "{{ current_profile_version | default('1000') }}"

destination_version:
  type: str
  help: "Destination profile version (new version)"
  default: "{{ (source_version | int + 1) | string }}"
  validator: >-
    {% set existing = existing_upgrade_files | default({}) %}{% if destination_version in existing %}{{ existing[destination_version] }} already exists; choose another destination_version{% endif %}

upgrade_step_import_steps:
  type: str
  multiselect: true
  help: >-
    GenericSetup import steps to run from the step's own profile
    (upgrades/<destination_version>/). Select none for a Python-only step.
  choices:
    "registry.xml (plone.app.registry)": plone.app.registry
    "types.xml, types/ (typeinfo)": typeinfo
    "workflows.xml (workflow)": workflow
    "catalog.xml (catalog)": catalog
    "rolemap.xml (rolemap)": rolemap
    "controlpanel.xml (controlpanel)": controlpanel
    "actions.xml (actions)": actions
    "browserlayer.xml (browserlayer)": browserlayer
    "componentregistry.xml (componentregistry)": componentregistry
    "portlets.xml (portlets)": portlets
    "viewlets.xml (viewlets)": viewlets
    "propertiestool.xml (propertiestool)": propertiestool
    "repositorytool.xml (repositorytool)": repositorytool
    "difftool.xml (difftool)": difftool
    "theme.xml (plone.app.theming)": plone.app.theming
  default: []
